<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyZen Crew · Crew View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f2a3a;
    --ink-soft: #4b6678;
    --accent: #1f7a85;
    --teal-dark: #164b57;
    --red: #e0392f;
    --amber: #f0930b;
    --green: #2bb38a;
    --logo-w: clamp(175px, 18vw, 345px);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  svg { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  body {
    position: relative;
    min-height: 100vh;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #b4d6ce 0%, #86b0ae 25%, #5b9095 50%, #3d7681 75%, #2a5e6b 100%);
    overflow-x: hidden;
  }

  /* Background: colour blobs + one full-page decor image */
  .blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blobs i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; animation: drift 18s ease-in-out infinite alternate; }
  .blobs i:nth-child(1) { width: 38vw; height: 38vw; left: -8vw; top: -10vw; background: #e6fff4; }
  .blobs i:nth-child(2) { width: 30vw; height: 30vw; right: 6vw; top: 18vh; background: #4ec3d9; animation-duration: 22s; animation-delay: -6s; }
  .blobs i:nth-child(3) { width: 34vw; height: 34vw; left: 28vw; bottom: -14vw; background: #2f6fd0; animation-duration: 26s; animation-delay: -12s; }
  .blobs i:nth-child(4) { width: 22vw; height: 22vw; left: 4vw; bottom: 8vh; background: #8ef0c8; animation-duration: 20s; animation-delay: -3s; }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(6vw,5vh,0) scale(1.15); } }
  .decor { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; z-index: 0; opacity: .85; mix-blend-mode: soft-light; }

  .page { position: relative; z-index: 1; width: min(88vw, 1500px); margin: 0 auto; padding: clamp(24px, 3vw, 44px) 0 clamp(110px, 10vw, 180px); }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { display: flex; align-items: flex-end; gap: clamp(4px, .5vw, 10px); }
  .logo { width: calc(var(--logo-w)*1.4); margin-top: 20px; auto; display: block; filter: drop-shadow(0 4px 14px rgba(0,40,60,.25)); position: relative; top: 20px;}
  .crew {
    font-weight: 300; color: var(--teal-dark); line-height: 1; letter-spacing: -.01em;
    font-size: calc(var(--logo-w) * .27);
    margin-bottom: 5px;
    margin-left: -40px;
  }
  .flight-no {
    font-family: 'DM Serif Display', 'Playfair Display', Georgia, serif;
    font-size: clamp(38px, 4.6vw, 86px);
    letter-spacing: .01em; line-height: 1; color: #fff;
    margin-top: clamp(150px, .8vw, 14px);
    text-shadow: 0 4px 20px rgba(0,40,60,.35);
  }

  /* Content column (narrower than header, as in the design) */
  .content { width: min(64vw, 1240px); margin: clamp(16px, 2vw, 34px) auto 0; }

  /* Glass surfaces */
  .glass {
    position: relative; overflow: hidden; isolation: isolate;
    background: linear-gradient(135deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.5) 100%);
    -webkit-backdrop-filter: blur(24px) saturate(185%); backdrop-filter: blur(24px) saturate(185%);
    border: 1px solid rgba(255,255,255,.75);
    box-shadow: inset 0 1.5px 1px rgba(255,255,255,1), inset 0 -1.5px 2px rgba(255,255,255,.4), 0 12px 30px rgba(8,50,62,.18);
    transition: transform .45s var(--spring), box-shadow .35s ease;
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at var(--mx, 25%) var(--my, 0%), rgba(255,255,255,.65), rgba(255,255,255,0) 55%);
    opacity: .25; transition: opacity .3s ease;
  }
  .glass::after {
    content: ""; position: absolute; left: 6%; right: 6%; top: 0; height: 28%; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)); border-radius: 0 0 60% 60% / 0 0 100% 100%;
  }
  .glass.lift:hover { transform: translateY(-4px) scale(1.008); box-shadow: inset 0 1.5px 1px #fff, inset 0 -1.5px 2px rgba(255,255,255,.5), 0 20px 42px rgba(8,50,62,.26); }
  .glass:hover::before { opacity: .8; }
  .glass > * { position: relative; z-index: 1; }

  .glass.dark {
    background: linear-gradient(135deg, rgba(23,98,104,.92) 0%, rgba(10,58,70,.96) 100%);
    border-color: rgba(170,225,210,.4); color: #fff;
    box-shadow: inset 0 1.5px 1px rgba(200,255,240,.45), inset 0 -1.5px 2px rgba(0,0,0,.2), 0 14px 34px rgba(4,40,48,.38);
  }
  .glass.dark::before { background: radial-gradient(circle at var(--mx, 25%) var(--my, 0%), rgba(190,245,225,.45), rgba(190,245,225,0) 55%); }
  .glass.dark::after { background: linear-gradient(180deg, rgba(200,255,240,.16), rgba(200,255,240,0)); }

  /* Summary row */
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(10px, 1vw, 18px); }
  .stat { border-radius: 30px; padding: clamp(14px, 1.3vw, 22px) clamp(16px, 1.4vw, 24px); min-height: clamp(90px, 7.6vw, 140px); }
  .stat .lbl { display: flex; align-items: center; gap: 10px; font-size: clamp(12px, 1vw, 18px); color: var(--ink-soft); }
  .stat .lbl svg { width: 1.3em; height: 1.3em; stroke: #9fe0f5; }
  .stat .num { font-size: clamp(26px, 2.3vw, 44px); font-weight: 600; margin-top: clamp(6px, .7vw, 12px); line-height: 1.1; }
  .stat.dark .lbl { color: #cfe8e0; }
  .stat .sub { font-size: clamp(11px, .9vw, 16px); color: #cfe8e0; margin-top: 4px; }
  .connection-status { grid-column: 1 / -1; min-height: 1.4em; margin: 0 0 0 8px; color: #fff; font-size: clamp(11px, .85vw, 15px); }
  .connection-status.error { color: #ffe2dd; }
  .dot { width: .75em; height: .75em; border-radius: 50%; flex-shrink: 0; }
  .dot.red { background: var(--red); box-shadow: 0 0 8px rgba(224,57,47,.5); }
  .dot.amber { background: var(--amber); box-shadow: 0 0 8px rgba(240,147,11,.5); }
  .dot.green { background: var(--green); box-shadow: 0 0 8px rgba(43,179,138,.5); }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: clamp(8px, .8vw, 14px); margin: clamp(14px, 1.6vw, 28px) 0 clamp(14px, 1.6vw, 26px) clamp(8px, 1.2vw, 24px); }
  .filter {
    cursor: pointer; font: inherit; font-size: clamp(12px, 1vw, 18px); color: var(--ink-soft);
    padding: clamp(8px, .8vw, 13px) clamp(14px, 1.3vw, 22px); border-radius: 999px;
    background: linear-gradient(135deg, rgba(255,255,255,.8), rgba(255,255,255,.55));
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: inset 0 1px 1px #fff, 0 4px 12px rgba(8,50,62,.12);
    transition: transform .4s var(--spring), background .3s ease, color .3s ease;
  }
  .filter:hover { transform: translateY(-2px); }
  .filter:active { transform: scale(.96); }
  .filter:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .filter.on { background: linear-gradient(135deg, rgba(23,98,104,.95), rgba(10,58,70,.98)); color: #fff; border-color: rgba(170,225,210,.4); box-shadow: inset 0 1.5px 1px rgba(200,255,240,.4), 0 8px 20px rgba(4,40,48,.3); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(12px, 1.2vw, 20px); }
  .pax { border-radius: 36px; padding: clamp(16px, 1.5vw, 26px) clamp(16px, 1.5vw, 26px) clamp(18px, 1.7vw, 30px); display: flex; flex-direction: column; }
  .pax.hide { display: none; }
  .pax.pop { animation: rise .6s var(--spring) backwards; }

  .pax .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seat { background: linear-gradient(135deg, #1b6a70, #0f4650); color: #fff; font-size: clamp(11px, .9vw, 16px); font-weight: 600; padding: 4px 11px; border-radius: 999px; box-shadow: 0 2px 6px rgba(4,40,48,.3); }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: clamp(10px, .85vw, 15px); font-weight: 500; padding: 4px 11px; border-radius: 999px; border: 1px solid transparent; }
  .tag::before, .chip-status::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: currentColor; }
  .t-high   { color: #c42a22; background: rgba(224,57,47,.12); border-color: rgba(224,57,47,.25); }
  .t-medium { color: #b86a00; background: rgba(240,147,11,.14); border-color: rgba(240,147,11,.3); }
  .t-normal { color: #17795c; background: rgba(43,179,138,.14); border-color: rgba(43,179,138,.28); }

  .score { text-align: right; }
  .score b { display: block; font-size: clamp(22px, 2vw, 38px); font-weight: 600; line-height: 1; }
  .score small { font-size: clamp(10px, .8vw, 14px); color: var(--ink-soft); }
  .pax h3 { font-size: clamp(16px, 1.45vw, 27px); font-weight: 600; margin-top: clamp(10px, 1vw, 18px); }

  .chip-status { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: clamp(14px, 1.2vw, 20px); font-size: clamp(12px, 1vw, 18px); font-weight: 500; padding: 6px 15px; border-radius: 999px; border: 1px solid transparent; }
  .metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: clamp(8px, .8vw, 14px); }
  .metric { display: inline-flex; align-items: center; gap: 6px; font-size: clamp(10px, .85vw, 15px); color: #4d6376; padding: 4px 11px; border-radius: 999px; background: rgba(15,42,58,.07); }
  .metric svg { width: 1.2em; height: 1.2em; }

  .eyebrow { font-size: clamp(10px, .85vw, 15px); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-soft); margin: clamp(14px, 1.5vw, 26px) 0 clamp(8px, .8vw, 14px); }
  .actions { display: flex; flex-direction: column; gap: clamp(8px, .8vw, 12px); }
  .act {
    display: flex; align-items: center; gap: 14px; cursor: pointer; font: inherit; text-align: left; color: var(--ink);
    font-size: clamp(13px, 1.1vw, 20px);
    padding: clamp(8px, .75vw, 12px) clamp(10px, .9vw, 15px); border-radius: 999px;
    background: rgba(15,42,58,.07); border: 1px solid rgba(255,255,255,.5);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.7);
    transition: transform .4s var(--spring), background .3s ease, color .3s ease;
  }
  .act:hover { transform: translateX(3px) scale(1.01); }
  .act:active { transform: scale(.97); }
  .act:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .act .ck { width: clamp(22px, 1.9vw, 34px); height: clamp(22px, 1.9vw, 34px); border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: rgba(255,255,255,.85); box-shadow: 0 1px 4px rgba(0,0,0,.08); transition: background .3s ease; }
  .act .ck svg { width: 58%; height: 58%; stroke: #fff; stroke-width: 2.6; opacity: 0; transform: scale(.4); transition: all .35s var(--spring); }
  .act.done { background: rgba(31,122,133,.16); color: var(--teal-dark); }
  .act.done .ck { background: var(--accent); }
  .act.done .ck svg { opacity: 1; transform: scale(1); }
  .act.done span { text-decoration: line-through; text-decoration-color: rgba(22,75,87,.4); }

  .back {
    position: fixed; z-index: 5; bottom: clamp(16px, 3vh, 36px);
    right: max(6vw, calc((100vw - 1500px) / 2));
    width: clamp(52px, 4.5vw, 84px); height: clamp(52px, 4.5vw, 84px);
    border-radius: 50%; display: grid; place-items: center; text-decoration: none;
    background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.4));
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: inset 0 1.5px 1px #fff, 0 10px 26px rgba(8,50,62,.25);
    transition: transform .4s var(--spring);
  }
  .back:hover { transform: scale(1.1) translateX(-3px); }
  .back svg { width: 48%; height: 48%; stroke: var(--accent); stroke-width: 2.6; }

  /* Entrance */
  .reveal { animation: rise .8s var(--spring) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(255,255,255,.88); } .glass.dark { background: #0f4650; } }
  @media (prefers-reduced-motion: reduce) { .blobs i, .reveal, .pax.pop { animation: none; opacity: 1; transform: none; } .glass, .filter, .act, .back { transition: none; } }
  @media (max-width: 1100px) { .content { width: 88vw; } .grid { grid-template-columns: repeat(2, 1fr); } .summary { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  .crew-request-act { width: 100%; }
  .crew-request-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .crew-request-copy small { color: var(--ink-soft); font-size: clamp(10px, .8vw, 14px); font-weight: 400; }
  .meal-prep-notice { margin-top: 12px; padding: 14px; border-radius: 22px; background: rgba(240,147,11,.12); border: 1px solid rgba(240,147,11,.35); }
  .meal-prep-notice .eyebrow { margin-top: 0; color: #9a5a00; }
  .meal-prep-notice p { margin-top: 8px; font-size: clamp(12px, 1vw, 17px); line-height: 1.45; }
  .meal-prep-notice small { display: block; margin-top: 6px; color: var(--ink-soft); font-size: clamp(10px, .8vw, 14px); }
  .meal-prep-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .meal-prep-choice { cursor: pointer; font: inherit; font-size: clamp(11px, .9vw, 15px); padding: 8px 14px; border-radius: 999px; color: var(--ink); background: rgba(255,255,255,.8); border: 1px solid rgba(15,42,58,.15); }
  .meal-prep-choice:hover { background: #fff; }
  .meal-prep-choice.is-selected { color: #fff; background: var(--teal-dark); border-color: var(--teal-dark); }
  .meal-prep-choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .meal-prep-choice:disabled { cursor: wait; opacity: .65; }

  /* Passenger order (sent from the meals page) */
  .order { margin-top: clamp(12px, 1.2vw, 20px); padding: clamp(10px, 1vw, 16px) clamp(12px, 1.1vw, 18px); border-radius: 22px;
    background: rgba(31,122,133,.12); border: 1px solid rgba(31,122,133,.3); }
  .order .head { display: flex; justify-content: space-between; align-items: center; font-size: clamp(10px, .85vw, 15px); letter-spacing: .25em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .order .new { letter-spacing: .05em; text-transform: none; font-size: clamp(10px, .8vw, 14px); padding: 2px 10px; border-radius: 999px; color: #fff; background: linear-gradient(135deg, #1b6a70, #0f4650); }
  .order .line { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: clamp(12px, 1vw, 18px); }
  .order .line span { color: var(--ink-soft); }
  .order .line b { font-weight: 600; text-align: right; }
  .order .when { margin-top: 8px; font-size: clamp(10px, .8vw, 14px); color: var(--ink-soft); }

  .t-dnd { color: #fff; background: linear-gradient(135deg, #1b6a70, #0f4650); border-color: rgba(170,225,210,.4); }
  .t-dnd::before { display: none; }
  .t-dnd svg { width: 1.2em; height: 1.2em; stroke: #d4f3e8; }
</style>
</head>
<body>

  <div class="blobs"><i></i><i></i><i></i><i></i></div>

  <div class="page">
    <header>
      <div class="brand">
        <img class="logo" src="/static/passenger/Images/cathayori.png" alt="Cathay Pacific SkyZen">
        <span class="crew">CREW</span>
      </div>
      <div class="flight-no" id="flightNo">CX844</div>
    </header>

    <main class="content">

      <!-- Summary -->
      <div class="summary">
        <div class="glass stat reveal"><div class="lbl"><span class="dot red"></span>High Priority</div><div class="num" id="nHigh">2</div></div>
        <div class="glass stat reveal"><div class="lbl"><span class="dot amber"></span>Medium Priority</div><div class="num" id="nMedium">2</div></div>
        <div class="glass stat reveal"><div class="lbl"><span class="dot green"></span>Normal</div><div class="num" id="nNormal">2</div></div>
        <div class="glass dark stat reveal">
          <div class="lbl"><svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>Passengers onboard</div>
          <div class="num" id="nTotal">—</div>
          <div class="sub">total passengers</div>
        </div>
        <p class="connection-status" id="connectionStatus" role="status" aria-live="polite">Connecting to passenger data…</p>
      </div>

      <!-- Filters -->
      <div class="filters" id="filters">
        <button class="filter on" data-f="all" type="button">All passengers</button>
        <button class="filter" data-f="high" type="button">High</button>
        <button class="filter" data-f="medium" type="button">Medium</button>
        <button class="filter" data-f="normal" type="button">Normal</button>
      </div>

      <!-- Passenger cards (rendered below) -->
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
  const ICON = {
    o2:     '<svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h14a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>',
    alert:  '<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg>',
    drop:   '<svg viewBox="0 0 24 24"><path d="M12 3s5 5.500 5 9.500a5 5 0 0 1-10 0C7 8.500 12 3 12 3z"/></svg>',
    heart:  '<svg viewBox="0 0 24 24"><path d="M20.400 5.600a5 5 0 0 0-7.100 0L12 7l-1.300-1.400a5 5 0 0 0-7.100 7.100L12 21l8.400-8.300a5 5 0 0 0 0-7.100z"/><path d="M6 12h3l1.500-2.500 2 5 1.500-2.500h3"/></svg>',
    check:  '<svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>'
  };
  const PRI = { high: ['t-high', 'High Priority'], medium: ['t-medium', 'Medium Priority'], normal: ['t-normal', 'Normal'] };

  const grid = document.getElementById('grid');
  const connectionStatus = document.getElementById('connectionStatus');
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const completedActions = new Set();
  const completedCrewRequests = new Set();
  const ovenMealDecisions = new Map();
  const passengersBySeat = new Map();
  let activeFilter = 'all';
  let refreshInProgress = false;
  let hasRendered = false;

  function priorityKey(priority) {
    const key = String(priority || '').toLowerCase();
    return ['high', 'medium'].includes(key) ? key : 'normal';
  }

  function renderDashboard(snapshot, wellness, crewRequests) {
    const passengers = snapshot.passengers;
    const plans = wellness.passengers;
    if (!Array.isArray(passengers) || !plans || typeof plans !== 'object') {
      throw new Error('The passenger API returned an unexpected response.');
    }
    passengersBySeat.clear();
    passengers.forEach(passenger => passengersBySeat.set(passenger.seat, passenger));

    document.getElementById('flightNo').textContent = snapshot.flight_id || 'Flight';
    document.getElementById('nTotal').textContent = snapshot.total_passengers ?? passengers.length;
    const counts = { high: 0, medium: 0, normal: 0 };

    grid.innerHTML = passengers.map((p, i) => {
      const priority = priorityKey(p.priority);
      const plan = plans[p.seat];
      if (!plan || !Array.isArray(plan.crew_recommendations?.actions)) {
        throw new Error(`Crew recommendations are unavailable for seat ${p.seat}.`);
      }
      counts[priority] += 1;
      const metrics = [
        ['heart', `HRV ${p.hrv.value} ${p.hrv.unit} · ${p.hrv.status}`],
        ['o2', `SpO₂ ${p.spo2.value}${p.spo2.unit} · ${p.spo2.status}`]
      ];
      if (p.reported_symptom) {
        metrics.push(['alert', `Reported: ${p.reported_symptom}`]);
      }
      const status = plan.status || 'Status unavailable';
      const actions = plan.crew_recommendations.actions;
      return `
        <article class="glass pax lift${hasRendered ? '' : ' reveal'}${activeFilter !== 'all' && activeFilter !== priority ? ' hide' : ''}" data-pri="${priority}" data-seat="${esc(p.seat)}" style="animation-delay:${200 + i * 80}ms">
          <div class="top">
            <div class="tags"><span class="seat">${esc(p.seat)}</span><span class="tag ${PRI[priority][0]}">${PRI[priority][1]}</span><span class="dnd-slot"></span></div>
            <div class="score" aria-hidden="true"></div>
          </div>
          <h3>${esc(p.name)}</h3>
          <span class="chip-status ${PRI[priority][0]}">${esc(status)}</span>
          <div class="metrics">${metrics.map(([icon, text]) => `<span class="metric">${ICON[icon]}${esc(text)}</span>`).join('')}</div>
          <div class="order-slot"></div>
          <div class="crew-request-slot"></div>
          <div class="meal-prep-slot"></div>
          <div class="oven-meal-slot"></div>
          <div class="eyebrow">Recommended action</div>
          <div class="actions">
            ${actions.map(action => {
              const key = `${p.seat}:${action}`;
              return `<button class="act${completedActions.has(key) ? ' done' : ''}" type="button" data-action="${esc(action)}"><span class="ck">${ICON.check}</span><span>${esc(action)}</span></button>`;
            }).join('')}
          </div>
        </article>`;
    }).join('');

    ['high', 'medium', 'normal'].forEach(key => {
      document.getElementById('n' + key[0].toUpperCase() + key.slice(1)).textContent = counts[key];
    });

    applyOrders();
    applyCrewRequests(crewRequests.requests);
    applyMealPrepActions(passengers);
    applyOvenMealChecklist();
    applyDnd();
    hasRendered = true;
  }

  document.querySelectorAll('.stat.reveal').forEach((el, i) => el.style.animationDelay = (i * 80) + 'ms');
  document.querySelectorAll('.stat').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });
  });

  grid.addEventListener('pointermove', e => {
    const el = e.target.closest('.glass');
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  });

  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter');
    if (!btn) return;
    document.querySelectorAll('.filter').forEach(b => b.classList.toggle('on', b === btn));
    const f = btn.dataset.f;
    activeFilter = f;
    document.querySelectorAll('.pax').forEach(card => {
      const show = f === 'all' || card.dataset.pri === f;
      card.classList.toggle('hide', !show);
      if (show) {
        card.classList.remove('reveal');
        card.style.animationDelay = '0ms';
        card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
      }
    });
  });

  grid.addEventListener('click', e => {
    const ovenMealChoice = e.target.closest('.oven-meal-choice');
    if (ovenMealChoice) {
      ovenMealDecisions.set(
        ovenMealChoice.dataset.seat,
        ovenMealChoice.dataset.decision
      );
      applyOvenMealChecklist();
      return;
    }

    const mealPrepChoice = e.target.closest('.meal-prep-choice');
    if (mealPrepChoice) {
      submitMealPrepChoice(mealPrepChoice);
      return;
    }

    const request = e.target.closest('.crew-request-act');
    if (request) {
      const key = request.dataset.requestId;
      request.classList.toggle('done');
      const completed = request.classList.contains('done');
      request.setAttribute('aria-pressed', String(completed));
      if (completed) completedCrewRequests.add(key);
      else completedCrewRequests.delete(key);
      return;
    }

    const act = e.target.closest('.act');
    if (!act) return;
    const key = `${act.closest('.pax').dataset.seat}:${act.dataset.action}`;
    act.classList.toggle('done');
    if (act.classList.contains('done')) completedActions.add(key);
    else completedActions.delete(key);
  });

  function applyOrders() {
    let all = {};
    try { all = JSON.parse(localStorage.getItem('skyzen_orders') || '{}'); } catch (e) {}
    document.querySelectorAll('.pax').forEach(card => {
      const slot = card.querySelector('.order-slot');
      const o = all[card.dataset.seat];
      if (!slot) return;
      if (!o) { slot.innerHTML = ''; return; }
      const t = new Date(o.sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      slot.innerHTML = `
        <div class="order">
          <div class="head">Passenger order <span class="new">New</span></div>
          <div class="line"><span>Meal</span><b>${esc(o.meal)}</b></div>
          <div class="line"><span>Drink</span><b>${esc(o.drink)}</b></div>
          <div class="when">Sent ${esc(t)}</div>
        </div>`;
    });
  }
  function applyCrewRequests(requests) {
    const requestsBySeat = new Map();
    requests.forEach(request => {
      const seatRequests = requestsBySeat.get(request.seat) || [];
      seatRequests.push(request);
      requestsBySeat.set(request.seat, seatRequests);
    });
    document.querySelectorAll('.pax').forEach(card => {
      const slot = card.querySelector('.crew-request-slot');
      const seatRequests = requestsBySeat.get(card.dataset.seat) || [];
      if (!slot) return;
      slot.innerHTML = seatRequests.length ? `
        <div class="eyebrow">Cabin crew requests</div>
        <div class="actions">${seatRequests.map(request => {
        const sentAt = new Date(request.sent_at).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });
        const requestId = request.id
          || `${request.seat}:${request.request_type}:${request.sent_at}:${request.item}`;
        const isCompleted = completedCrewRequests.has(requestId);
        return `
          <button class="act crew-request-act${isCompleted ? ' done' : ''}" type="button" data-request-id="${esc(requestId)}" aria-pressed="${isCompleted}">
            <span class="ck">${ICON.check}</span>
            <span class="crew-request-copy">
              <span>${esc(request.item)} requested by ${esc(request.name)}</span>
              <small>${esc(request.request_type || 'Cabin crew request')} · Seat ${esc(request.seat)} · Sent ${esc(sentAt)}</small>
            </span>
          </button>`;
        }).join('')}</div>` : '';
    });
  }
  function applyMealPrepActions(passengers) {
    const passengersBySeat = new Map(passengers.map(passenger => [
      passenger.seat,
      passenger
    ]));
    document.querySelectorAll('.pax').forEach(card => {
      const slot = card.querySelector('.meal-prep-slot');
      const passenger = passengersBySeat.get(card.dataset.seat);
      if (!slot || !passenger) return;

      const dinner = passenger.schedule?.find(event => event.type === 'dinner');
      const elapsed = Number(passenger.flight_elapsed_hours);
      const decision = passenger.meal_prep_decision;
      if (decision) {
        const status = decision.decision === 'yes'
          ? 'Demo only: Oven A is marked as preheating. No physical oven is connected.'
          : 'Crew chose not to preheat Oven A.';
        slot.innerHTML = `
          <div class="meal-prep-notice" role="status">
            <div class="eyebrow">Meal preparation</div>
            <p>${esc(passenger.name)}: ${esc(status)}</p>
          </div>`;
        return;
      }

      const promptOpensAt = dinner?.hour - 0.5;
      const hasUpcomingMealPrep = Number.isFinite(elapsed)
        && Number.isFinite(promptOpensAt)
        && promptOpensAt >= 0
        && elapsed < promptOpensAt;
      if (hasUpcomingMealPrep) {
        const minutesUntilPrompt = Math.ceil((promptOpensAt - elapsed) * 60);
        const hours = Math.floor(minutesUntilPrompt / 60);
        const minutes = minutesUntilPrompt % 60;
        const timeUntilPrompt = hours
          ? `${hours}h ${minutes}m`
          : `${minutes}m`;
        slot.innerHTML = `
          <div class="meal-prep-notice" role="status">
            <div class="eyebrow">Upcoming Oven A notification</div>
            <p>The Oven A preheat prompt for ${esc(passenger.name)} opens in ${esc(timeUntilPrompt)}, 30 minutes before the scheduled meal.</p>
            <small>Demo only: the prompt does not control physical cabin equipment.</small>
          </div>`;
        return;
      }

      const promptIsOpen = Number.isFinite(elapsed)
        && Number.isFinite(promptOpensAt)
        && promptOpensAt >= 0
        && elapsed >= promptOpensAt
        && elapsed < dinner.hour;
      if (!promptIsOpen) {
        slot.replaceChildren();
        return;
      }

      slot.innerHTML = `
        <div class="meal-prep-notice">
          <div class="eyebrow">Scheduled meal · crew action</div>
          <p>${esc(passenger.name)} is scheduled to eat in the next 30 minutes. Pre-heat Oven A?</p>
          <small>Demo only: Yes simulates preheating; it does not control a physical oven.</small>
          <div class="meal-prep-controls">
            <button class="meal-prep-choice" type="button" data-seat="${esc(passenger.seat)}" data-decision="yes">Yes, preheat Oven A</button>
            <button class="meal-prep-choice" type="button" data-seat="${esc(passenger.seat)}" data-decision="no">No</button>
          </div>
          <small class="meal-prep-error" role="alert"></small>
        </div>`;
    });
  }
  async function submitMealPrepChoice(button) {
    const seat = button.dataset.seat;
    const decision = button.dataset.decision;
    const notice = button.closest('.meal-prep-notice');
    const buttons = notice.querySelectorAll('.meal-prep-choice');
    const errorMessage = notice.querySelector('.meal-prep-error');
    buttons.forEach(choice => { choice.disabled = true; });
    try {
      const result = await submitMealPrepDecision(seat, decision);
      const passenger = passengersBySeat.get(seat);
      if (!passenger) {
        throw new Error(`Passenger data for seat ${seat} is unavailable.`);
      }
      passenger.meal_prep_decision = result;
      applyMealPrepActions(Array.from(passengersBySeat.values()));
    } catch (error) {
      errorMessage.textContent = `Could not save this decision: ${error.message}`;
      buttons.forEach(choice => { choice.disabled = false; });
    }
  }
  function applyOvenMealChecklist() {
    document.querySelectorAll('.pax').forEach(card => {
      const slot = card.querySelector('.oven-meal-slot');
      const seat = card.dataset.seat;
      if (!slot) return;
      if (!['4F', '5C'].includes(seat)) {
        slot.replaceChildren();
        return;
      }

      const decision = ovenMealDecisions.get(seat);
      const response = decision === 'yes'
        ? 'Yes selected - Oven A preheating is simulated only.'
        : decision === 'no'
          ? 'No selected - the meal will not be preheated.'
          : '';
      slot.innerHTML = `
        <div class="meal-prep-notice">
          <div class="eyebrow">Oven checklist · demo</div>
          <p>Preheat ${esc(passengersBySeat.get(seat)?.name || `seat ${seat}`)}'s meal?</p>
          <small>Choose Yes or No. This demo does not control cabin equipment.</small>
          <div class="meal-prep-controls">
            <button class="meal-prep-choice oven-meal-choice${decision === 'yes' ? ' is-selected' : ''}" type="button" data-seat="${esc(seat)}" data-decision="yes" aria-pressed="${decision === 'yes'}">Yes</button>
            <button class="meal-prep-choice oven-meal-choice${decision === 'no' ? ' is-selected' : ''}" type="button" data-seat="${esc(seat)}" data-decision="no" aria-pressed="${decision === 'no'}">No</button>
          </div>
          ${response ? `<small role="status">${esc(response)}</small>` : ''}
        </div>`;
    });
  }
  applyOrders();
  window.addEventListener('storage', e => { if (e.key === 'skyzen_orders') applyOrders(); });  
const BELL_OFF = '<svg viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M2 2l20 20"/></svg>';
function applyDnd() {
  let all = {};
  try { all = JSON.parse(localStorage.getItem('skyzen_dnd') || '{}'); } catch (e) {}
  document.querySelectorAll('.pax').forEach(card => {
    const slot = card.querySelector('.dnd-slot');
    if (!slot) return;
    const d = all[card.dataset.seat];
    slot.innerHTML = (d && d.on) ? `<span class="tag t-dnd">${BELL_OFF}Do not disturb</span>` : '';
  });
}
applyDnd();
window.addEventListener('storage', e => { if (e.key === 'skyzen_dnd') applyDnd(); });

  async function refreshDashboard() {
    if (refreshInProgress) return;
    refreshInProgress = true;
    try {
      const [snapshot, wellness, crewRequests] = await Promise.all([
        getSnapshot(),
        getAllWellness(),
        getCrewCoffeeRequests()
      ]);
      if (!Array.isArray(crewRequests.requests)) {
        throw new Error('The crew request API returned an unexpected response.');
      }
      renderDashboard(snapshot, wellness, crewRequests);
      const updatedAt = snapshot.timestamp
        ? new Date(snapshot.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        : 'just now';
      connectionStatus.textContent = `Live data · updated ${updatedAt}`;
      connectionStatus.classList.remove('error');
    } catch (error) {
      connectionStatus.textContent = `Could not load passenger data: ${error.message}`;
      connectionStatus.classList.add('error');
      console.error('Crew dashboard refresh failed:', error);
    } finally {
      refreshInProgress = false;
    }
  }

  refreshDashboard();
  window.setInterval(refreshDashboard, 5000);
</script>
</body>
</html>
