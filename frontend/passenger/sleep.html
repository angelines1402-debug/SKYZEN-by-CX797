<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyZen · Your Wellness Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f2a3a;
    --ink-soft: #4b6678;
    --accent: #1f7a85;
    --switch: #1f8aa8;
    --teal-dark: #164b57;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  svg { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  body {
    position: relative;
    min-height: 100vh;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #b4d6ce 0%, #86b0ae 25%, #5b9095 50%, #3d7681 75%, #2a5e6b 100%);
    overflow-x: hidden;
    transition: background 1s ease, color 1s ease;
  }
  body.night-mode {
    color: #eef2ff;
    background: linear-gradient(135deg, #0b1021 0%, #111a36 35%, #202b52 70%, #10172f 100%);
  }
  body.night-mode .blobs i { opacity: .28; background: #7485d7; }
  body.night-mode .title { color: #e8edff; }

  /* Background: colour blobs + one full-page decor image */
  .blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blobs i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; animation: drift 18s ease-in-out infinite alternate; }
  .blobs i:nth-child(1) { width: 38vw; height: 38vw; left: -8vw; top: -10vw; background: #e6fff4; }
  .blobs i:nth-child(2) { width: 30vw; height: 30vw; right: 6vw; top: 18vh; background: #4ec3d9; animation-duration: 22s; animation-delay: -6s; }
  .blobs i:nth-child(3) { width: 34vw; height: 34vw; left: 28vw; bottom: -14vw; background: #2f6fd0; animation-duration: 26s; animation-delay: -12s; }
  .blobs i:nth-child(4) { width: 22vw; height: 22vw; left: 4vw; bottom: 8vh; background: #8ef0c8; animation-duration: 20s; animation-delay: -3s; }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(6vw,5vh,0) scale(1.15); } }
  .decor { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; z-index: 0; opacity: .85; mix-blend-mode: soft-light; }

  .page { position: relative; z-index: 1; width: min(88vw, 1500px); margin: 0 auto; padding: clamp(24px, 3vw, 44px) 0 clamp(110px, 10vw, 180px); }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .logo { width: clamp(210px, 22vw, 420px); height: auto; display: block; filter: drop-shadow(0 4px 14px rgba(0,40,60,.25)); }
  .flight-no {
    font-family: 'DM Serif Display', 'Playfair Display', Georgia, serif;
    font-size: clamp(38px, 4.6vw, 86px);
    letter-spacing: .01em; line-height: 1; color: #fff;
    margin-top: clamp(90px, .8vw, 14px);
    text-shadow: 0 4px 20px rgba(0,40,60,.35);
  }

  .title { margin-top: clamp(8px, 1.2vw, 20px); margin-left: 30px; color: var(--teal-dark); }
  .title h1 { font-weight: 300; font-size: clamp(38px, 4.4vw, 84px); line-height: 1; letter-spacing: -.01em; }
  .title p { font-weight: 700; font-size: clamp(15px, 1.5vw, 28px); margin-top: 4px; }

  /* Glass surfaces */
  .glass {
    position: relative; overflow: hidden; isolation: isolate;
    background: linear-gradient(135deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.5) 100%);
    -webkit-backdrop-filter: blur(24px) saturate(185%); backdrop-filter: blur(24px) saturate(185%);
    border: 1px solid rgba(255,255,255,.75);
    box-shadow: inset 0 1.5px 1px rgba(255,255,255,1), inset 0 -1.5px 2px rgba(255,255,255,.4), 0 12px 30px rgba(8,50,62,.18);
    transition: transform .45s var(--spring), box-shadow .35s ease, border-color .5s ease;
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at var(--mx, 25%) var(--my, 0%), rgba(255,255,255,.65), rgba(255,255,255,0) 55%);
    opacity: .25; transition: opacity .3s ease;
  }
  .glass::after {
    content: ""; position: absolute; left: 6%; right: 6%; top: 0; height: 30%; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)); border-radius: 0 0 60% 60% / 0 0 100% 100%;
  }
  .glass.lift:hover { transform: translateY(-4px) scale(1.008); box-shadow: inset 0 1.5px 1px #fff, inset 0 -1.5px 2px rgba(255,255,255,.5), 0 20px 42px rgba(8,50,62,.26); }
  .glass:hover::before { opacity: .8; }
  .glass > * { position: relative; z-index: 1; }

  /* ===== Main sleep toggle ===== */
  .hero {
    display: block; width: 100%; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
    margin-top: clamp(16px, 2vw, 34px);
    border-radius: 44px;
    padding: clamp(22px, 2.2vw, 38px) clamp(24px, 2.4vw, 40px);
    min-height: clamp(130px, 11.5vw, 220px);
    transition: transform .45s var(--spring), box-shadow .35s ease, border-color .5s ease, color .5s ease;
  }
  /* dark green-turquoise layer that fades in when resting */
  .hero .night {
    position: absolute; inset: 0; z-index: 0; opacity: 0; transition: opacity .6s ease; pointer-events: none;
    background: linear-gradient(135deg, rgba(23,98,104,.95) 0%, rgba(10,58,70,.98) 100%);
  }
  .hero.resting .night { opacity: 1; }
  .hero.resting { color: #fff; border-color: rgba(170,225,210,.4); box-shadow: inset 0 1.5px 1px rgba(200,255,240,.45), inset 0 -1.5px 2px rgba(0,0,0,.2), 0 14px 34px rgba(4,40,48,.38); }
  .hero:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .hero:active { transform: scale(.99); }

  .hero .inner { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; height: 100%; min-height: inherit; }
  .hero .eyebrow, .hero .state, .hero .desc { transition: color .5s ease, opacity .25s ease; }
  .eyebrow { font-size: clamp(11px, .95vw, 18px); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-soft); }
  .hero.resting .eyebrow { color: #a9d9cb; }
  .hero .state { font-size: clamp(24px, 2.4vw, 46px); font-weight: 600; margin-top: clamp(6px, .7vw, 12px); }
  .hero .desc { font-size: clamp(13px, 1.25vw, 23px); font-weight: 300; color: var(--ink-soft); margin-top: clamp(20px, 2.6vw, 44px); }
  .hero.resting .desc { color: #d3ebe3; }
  .hero .swap { opacity: 0; }

  /* big switch */
  .bigswitch {
    position: relative; flex-shrink: 0;
    width: clamp(110px, 10vw, 192px); height: clamp(56px, 5vw, 96px);
    border-radius: 999px; margin-top: clamp(4px, .6vw, 12px);
    background: #1f6b78; box-shadow: inset 0 2px 6px rgba(0,0,0,.25);
    transition: background .5s ease;
  }
  .hero.resting .bigswitch { background: #2a93c9; }
  .bigswitch .knob {
    position: absolute; top: 8%; left: 8%; width: 42%; aspect-ratio: 1; height: 84%; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #fff, #e6f0f0);
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    transform: translateX(100%);      /* awake: knob on the right */
    transition: transform .55s var(--spring), background .4s ease;
  }
  .hero.resting .knob { transform: translateX(0); }  /* resting: knob on the left */
  .bigswitch .knob svg { position: absolute; width: 56%; height: 56%; transition: opacity .3s ease, transform .5s var(--spring); }
  .bigswitch .sun  { stroke: #f2a516; fill: #f7b52e; opacity: 1; }
  .bigswitch .moon { stroke: #1f6f8e; opacity: 0; transform: rotate(-40deg) scale(.6); }
  .hero.awake .knob { background: rgba(160,215,200,.95); }
  .hero.resting .sun  { opacity: 0; transform: rotate(60deg) scale(.6); }
  .hero.resting .moon { opacity: 1; transform: none; }

  /* ===== Lower cards ===== */
  .panels { display: grid; grid-template-columns: 1fr; gap: clamp(16px, 2vw, 36px); margin-top: clamp(16px, 2vw, 34px); align-items: stretch; }
  .panel { border-radius: 40px; padding: clamp(22px, 2.1vw, 36px); }

  .toggles { display: flex; flex-direction: column; gap: clamp(14px, 1.7vw, 30px); padding-top: clamp(6px, 1vw, 16px); }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .opt .lbl { display: flex; align-items: center; gap: clamp(12px, 1.2vw, 20px); font-size: clamp(15px, 1.35vw, 25px); font-weight: 500; }
  .opt .lbl svg { width: clamp(18px, 1.5vw, 28px); height: clamp(18px, 1.5vw, 28px); stroke: var(--ink-soft); }

  .switch {
    position: relative; flex-shrink: 0; cursor: pointer; border: 0;
    width: clamp(48px, 4vw, 76px); height: clamp(28px, 2.3vw, 44px); border-radius: 999px;
    background: rgba(15,42,58,.12); box-shadow: inset 0 1px 3px rgba(0,0,0,.12);
    transition: background .35s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 12%; left: 6%; height: 76%; aspect-ratio: 1; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25);
    transition: transform .4s var(--spring);
  }
  .switch[aria-checked="true"] { background: var(--switch); }
  .switch[aria-checked="true"]::after { transform: translateX(99%); }
  .switch:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .sched-title { margin-bottom: clamp(4px, .6vw, 10px); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: clamp(14px, 1.4vw, 24px) 0; border-bottom: 1px solid rgba(15,42,58,.1); font-size: clamp(15px, 1.35vw, 25px); font-weight: 500; }
  .row:last-child { border-bottom: 0; padding-bottom: 4px; }
  .row time { font-size: clamp(13px, 1.1vw, 21px); font-weight: 300; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* Back button */
  .back {
    position: fixed; z-index: 5; bottom: clamp(16px, 3vh, 36px);
    right: max(6vw, calc((100vw - 1500px) / 2));
    width: clamp(52px, 4.5vw, 84px); height: clamp(52px, 4.5vw, 84px);
    border-radius: 50%; display: grid; place-items: center; text-decoration: none;
    background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.4));
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: inset 0 1.5px 1px #fff, 0 10px 26px rgba(8,50,62,.25);
    transition: transform .4s var(--spring);
  }
  .back:hover { transform: scale(1.1) translateX(-3px); }
  .back svg { width: 48%; height: 48%; stroke: var(--accent); stroke-width: 2.6; }

  /* Entrance */
  .reveal { opacity: 0; transform: translateY(18px) scale(.98); animation: rise .8s var(--spring) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(255,255,255,.88); } }
  @media (prefers-reduced-motion: reduce) { .blobs i, .reveal { animation: none; opacity: 1; transform: none; } .glass, .hero, .knob, .switch, .switch::after, .back, .night { transition: none; } }
  @media (max-width: 900px) { .page { width: 92vw; } .panels { grid-template-columns: 1fr; } }
</style>
</head>
<body>

  <div class="blobs"><i></i><i></i><i></i><i></i></div>

  <div class="page">
    <header>
      <img class="logo" src="/static/passenger/Images/cathayori.png" alt="Cathay Pacific SkyZen">
      <div class="flight-no">CX844</div>
    </header>

    <div class="title">
      <h1>Your Wellness Journey</h1>
      <p>Your personalized sleep schedule for this flight</p>
    </div>

    <div class="panels">

      <!-- Schedule -->
      <section class="glass panel lift reveal">
        <div class="eyebrow sched-title">Your Wellness Journey</div>
        <div id="scheduleRows" aria-live="polite">
          <div class="row"><span>Loading schedule…</span></div>
        </div>
      </section>

      <!-- Main toggle: Awake <-> Resting -->
      <button id="hero" class="glass hero awake reveal" type="button" role="switch" aria-checked="false" aria-label="Sleep mode">
        <span class="night"></span>
        <div class="inner">
          <div>
            <div class="eyebrow" id="heroEyebrow">Sleep Mode</div>
            <div class="state" id="heroState">Awake</div>
            <div class="desc" id="heroDesc">Tap to begin your sleep sequence</div>
          </div>
          <div class="bigswitch" aria-hidden="true">
            <div class="knob">
              <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4-1.4"/></svg>
              <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </div>
          </div>
        </div>
      </button>

      <!-- Options -->
      <section class="glass panel lift reveal">
        <div class="toggles">
          <div class="opt">
            <span class="lbl"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.300 21a1.900 1.900 0 0 0 3.400 0"/></svg>Do not disturb</span>
            <button class="switch" id="dndSwitch" type="button" role="switch" aria-checked="true" aria-label="Do not disturb"></button>
          </div>
          <div class="opt">
            <span class="lbl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>Sunrise wake-up light</span>
            <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Sunrise wake-up light"></button>
          </div>
          <div class="opt">
            <span class="lbl"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.500 8.500a5 5 0 0 1 0 7"/><path d="M18.500 5.500a9 9 0 0 1 0 13"/></svg>Cabin noise masking</span>
            <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Cabin noise masking"></button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <a class="back" href="dashboard4.html" aria-label="Back to dashboard">
    <svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
  </a>

<script src="/static/js/api.js"></script>
<script>
  document.querySelectorAll('.reveal').forEach((el, i) => el.style.animationDelay = (i * 90) + 'ms');

  document.querySelectorAll('.glass').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });
  });

  const hero = document.getElementById('hero');
  const txt = {
    awake:   { eyebrow: 'Sleep Mode',        state: 'Awake',   desc: 'Tap to begin your sleep sequence' },
    resting: { eyebrow: 'Sleep Mode Active', state: 'Resting', desc: 'Lights dimmed to 5% · Temperature 21°C · Massage ready' }
  };
  const fields = ['heroEyebrow', 'heroState', 'heroDesc'].map(id => document.getElementById(id));

  hero.addEventListener('click', () => {
    const toResting = hero.classList.contains('awake');
    hero.classList.toggle('awake', !toResting);
    hero.classList.toggle('resting', toResting);
    hero.setAttribute('aria-checked', String(toResting));

    const t = txt[toResting ? 'resting' : 'awake'];
    fields.forEach(f => f.style.opacity = 0);
    setTimeout(() => {
      fields[0].textContent = t.eyebrow;
      fields[1].textContent = t.state;
      fields[2].textContent = t.desc;
      fields.forEach(f => f.style.opacity = 1);
    }, 220);
  });

  document.querySelectorAll('.switch').forEach(sw => {
    sw.addEventListener('click', () => {
      sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
    });
  });
const SEAT = new URLSearchParams(window.location.search).get('seat') || '2A';
const DND_SEAT = SEAT, DND_KEY = 'skyzen_dnd';
const dndSwitch = document.getElementById('dndSwitch');
const scheduleRows = document.getElementById('scheduleRows');

document.querySelectorAll('a[href="dashboard4.html"]').forEach(link => {
  const url = new URL(link.href);
  url.searchParams.set('seat', SEAT);
  link.href = url.href;
});

function renderSchedule(schedule) {
  scheduleRows.replaceChildren();
  if (!schedule.length) {
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = 'No passenger sleep plan is available for this seat.';
    scheduleRows.appendChild(row);
    return;
  }

  schedule.forEach(event => {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('span');
    const time = document.createElement('time');
    label.textContent = event.label;
    time.dataset.hour = event.hour;
    row.append(label, time);
    scheduleRows.appendChild(row);
  });
}

function updateScheduleCountdowns(elapsedHours) {
  scheduleRows.querySelectorAll('time[data-hour]').forEach(time => {
    time.textContent = formatFlightCountdown(
      time.dataset.hour,
      elapsedHours
    );
  });
}

let sleepPageRefreshInProgress = false;
async function refreshSleepSchedule() {
  if (sleepPageRefreshInProgress) return;
  sleepPageRefreshInProgress = true;
  try {
    const passenger = await getPassenger(SEAT);
    if (scheduleRows.dataset.loaded !== 'true') {
      renderSchedule(passenger.schedule);
      scheduleRows.dataset.loaded = 'true';
    }
    updateScheduleCountdowns(passenger.flight_elapsed_hours);
    const sleepStart = passenger.schedule.find(
      event => event.type === 'sleep_start'
    );
    const wakeUp = passenger.schedule.find(
      event => event.type === 'wake_up'
    );
    const elapsed = Number(passenger.flight_elapsed_hours);
    const isSleepTime = sleepStart && wakeUp && Number.isFinite(elapsed)
      && elapsed >= sleepStart.hour
      && elapsed < wakeUp.hour;
    document.body.classList.toggle('night-mode', Boolean(isSleepTime));
  } catch (error) {
    scheduleRows.textContent = 'Could not load passenger sleep schedule.';
    console.error('Sleep schedule error:', error);
  } finally {
    sleepPageRefreshInProgress = false;
  }
}

refreshSleepSchedule();
window.setInterval(refreshSleepSchedule, 2000);

function saveDnd() {
  try {
    const all = JSON.parse(localStorage.getItem(DND_KEY) || '{}');
    all[DND_SEAT] = { on: dndSwitch.getAttribute('aria-checked') === 'true', at: Date.now() };
    localStorage.setItem(DND_KEY, JSON.stringify(all));  // the crew view reads this
  } catch (e) {}
}

try {
  const saved = (JSON.parse(localStorage.getItem(DND_KEY) || '{}'))[DND_SEAT];
  if (saved) dndSwitch.setAttribute('aria-checked', String(saved.on));
} catch (e) {}
saveDnd();
dndSwitch.addEventListener('click', saveDnd);          // runs after the switch has toggled
</script>
</body>
</html>
